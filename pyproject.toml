[project]
name = "jam"
version = "0.1.0"
description = "Job Application Manager - A local-first CLI tool for tracking job applications"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "httpx>=0.27.0",
    "python-jobspy>=1.1.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
jam = "jam.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jam", "api"]
